name: Keep Database Active

on:
  schedule:
    # Run every 4 hours to prevent database sleep
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Health Endpoint (Netlify - Function)
        continue-on-error: true
        run: |
          echo "Pinging Netlify serverless function..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://wellnespal.netlify.app/.netlify/functions/health || echo "000")
          echo "Netlify Function Response Code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Netlify function responded (Database pinged)"
          else
            echo "⚠ Netlify function: Trying static health page..."
            RESPONSE2=$(curl -s -o /dev/null -w "%{http_code}" https://wellnespal.netlify.app/health.html || echo "000")
            echo "Netlify Static Response Code: $RESPONSE2"
            if [ "$RESPONSE2" = "200" ]; then
              echo "✓ Netlify static page responded (Database pinged)"
            fi
          fi
      
      - name: Ping Health Endpoint (Azure)
        continue-on-error: true
        run: |
          echo "Pinging Azure deployment..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://ashy-moss-04f0b450f.4.azurestaticapps.net/health.html || echo "000")
          echo "Azure Response Code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Azure endpoint responded (Database pinged)"
          else
            echo "⚠ Azure endpoint did not respond as expected"
          fi
      
      - name: Ping Health Endpoint (Hostinger)
        continue-on-error: true
        run: |
          echo "Pinging Hostinger deployment..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://wellness.benbolpharmacy.com/health.html || echo "000")
          echo "Hostinger Response Code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Hostinger endpoint responded (Database pinged)"
          else
            echo "⚠ Hostinger endpoint did not respond as expected"
          fi
      
      - name: Summary
        run: |
          echo "=========================================="
          echo "Database Keep-Alive Check Complete"
          echo "Timestamp: $(date -u)"
          echo "=========================================="
